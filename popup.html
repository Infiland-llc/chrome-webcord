<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Camera Recorder</title>
    <link rel="stylesheet" href="src/popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>HTML Camera Recorder</h1>
        <p>在当前页面显示摄像头浮窗，并录制页面活动。</p>
      </header>

      <div class="actions">
        <button id="openPanel" type="button">打开浮动控制面板</button>
        <button id="startRecording" type="button">开始录制当前页</button>
        <button id="toggleOverlay" type="button">显示 / 隐藏浮窗</button>
        <button id="stopRecording" type="button">停止录制</button>
        <button id="resetOverlay" type="button">重置浮窗</button>
      </div>

      <p class="note">
        推荐打开浮动控制面板进行录制。题词板和控制按钮不会进入当前标签页录制。
      </p>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="src/popup.js"></script>
  </body>
</html>
