<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Camera Recorder Test Page</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f4f7fb;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        padding: 44px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 26px;
      }

      .card {
        min-height: 160px;
        padding: 18px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #ffffff;
      }

      button {
        min-height: 38px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: #2563eb;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .ball {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        background: #ef4444;
        animation: move 2.8s ease-in-out infinite alternate;
      }

      @keyframes move {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(min(420px, 55vw));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>测试页面</h1>
      <p>这个页面包含动画、按钮和输入框，用于验证扩展录制页面活动。</p>
      <button id="counter">点击计数：0</button>
      <div class="grid">
        <section class="card">
          <h2>动画区域</h2>
          <div class="ball"></div>
        </section>
        <section class="card">
          <h2>输入区域</h2>
          <label>
            测试文本
            <input type="text" value="正在录制 HTML 页面活动">
          </label>
        </section>
      </div>
    </main>
    <script>
      const counter = document.getElementById("counter");
      let value = 0;
      counter.addEventListener("click", () => {
        value += 1;
        counter.textContent = `点击计数：${value}`;
      });
    </script>
  </body>
</html>
